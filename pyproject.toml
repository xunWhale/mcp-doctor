[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-doctor"
version = "0.1.0"
description = "Dependency-free MCP stdio and legacy SSE diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mcp-doctor contributors"}]
dependencies = []

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
